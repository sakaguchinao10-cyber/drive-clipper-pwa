<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data: https:; connect-src 'self' https://www.googleapis.com https://accounts.google.com https://content.googleapis.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com https://content.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DriveNotes</title>
<meta name="description" content="Google Drive に保存したノート（Evernote バックアップ・WebClips）の閲覧と登録">
<meta name="theme-color" content="#1f5f57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DriveNotes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="メニュー">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#/">DriveNotes</a>
  <form class="search" id="searchForm" role="search">
    <input id="searchInput" type="search" placeholder="ノートを検索" enterkeyhint="search" autocomplete="off">
  </form>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="ノートブック"></nav>
  <div class="scrim" id="scrim"></div>
  <main id="main" tabindex="-1"></main>
</div>

<a class="fab" id="fab" href="#/new" aria-label="新しいノート">
  <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
</a>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="lightbox" id="lightbox" hidden></div>

<script src="config.js"></script>
<script src="lib/marked.min.js"></script>
<script src="lib/purify.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="app.js"></script>
</body>
</html>
